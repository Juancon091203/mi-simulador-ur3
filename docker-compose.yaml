version: '3'
services:
  server:
    build: ./server
    ports:
      - 3000:3000
    volumes:
      - ./server:/app
      - ./scenes:/app/scenes
    command: npm run dev
    # command: tail -F anything.js
    networks:
      - robot_network
    depends_on:
      - flask-server

  flask-server:
    build: ./flask-server
    container_name: flask_app
    volumes:
      - ./flask-server:/app
    restart: always
    command: python3 app.py
    # command: tail -F anything.js
    ports:
      - 5000:5000 
    networks:
      - robot_network 

  unpack:
    build: ./scenes
    volumes:
      - ./scenes:/app

  ursim:
  # image: universalrobots/ursim_e-series
    image: universalrobots/ursim_cb3
    container_name: ursim_simulator
    ports:
      - "5900:5900"
      - "6080:6080"
      - "29999:29999"
      - "30001-30004:30001-30004"
    networks:
      - robot_network

networks:
  robot_network: